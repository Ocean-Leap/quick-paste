# quick-paste full stack (SPEC §12.4): PostgreSQL + server (fat JAR, serves the PWA) + Caddy.
# Secrets/tunables come from the environment or a .env file next to this compose file.
name: quick-paste

services:
  db:
    # pgvector-enabled PostgreSQL: the v3 Library's semantic search uses the
    # vector extension, created by the V1 migration.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: quickpaste
      POSTGRES_USER: quickpaste
      # Required — compose refuses to start without it, so a fresh clone can
      # never come up on publicly-known default credentials. Set it in .env.
      POSTGRES_PASSWORD: ${QP_DB_PASS:?set QP_DB_PASS in .env}
    volumes:
      - qp-pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces the TCP check the app actually uses; without it
      # pg_isready would pass against the socket-only temporary server that the
      # postgres entrypoint runs during first-boot initdb, releasing dependents
      # before TCP 5432 accepts connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U quickpaste -d quickpaste"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    # Default: build locally (`docker compose up --build`). To skip the build and
    # pull a prebuilt image instead, set QP_SERVER_IMAGE in .env to the published
    # image (e.g. ghcr.io/<owner>/quick-paste-server:latest) — then `docker
    # compose up -d` pulls it, no build toolchain needed.
    image: ${QP_SERVER_IMAGE:-quick-paste-server:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Not published on the host — Caddy is the only entry point.
    environment:
      QP_DB_URL: jdbc:postgresql://db:5432/quickpaste
      QP_DB_USER: quickpaste
      QP_DB_PASS: ${QP_DB_PASS:-quickpaste}
      QP_STORAGE_DIR: /data/blobs
      QP_PUBLIC_URL: ${QP_PUBLIC_URL:-http://localhost:8080}
      # Caddy always fronts the server here (1 hop). Set to 2 behind Cloudflare.
      QP_TRUSTED_PROXY_COUNT: ${QP_TRUSTED_PROXY_COUNT:-1}
      QP_AUTH_MODE: ${QP_AUTH_MODE:-google}
      QP_LOCAL_PASSWORD: ${QP_LOCAL_PASSWORD:-}
      QP_GOOGLE_CLIENT_ID: ${QP_GOOGLE_CLIENT_ID:-}
      QP_GOOGLE_CLIENT_SECRET: ${QP_GOOGLE_CLIENT_SECRET:-}
      QP_ALLOWED_EMAILS: ${QP_ALLOWED_EMAILS:-}
      QP_SESSION_SECRET: ${QP_SESSION_SECRET:-}
      QP_DEV_AUTH_BYPASS: ${QP_DEV_AUTH_BYPASS:-false}
      QP_DEV_USER_EMAIL: ${QP_DEV_USER_EMAIL:-dev@localhost}
      QP_CLIP_TTL_HOURS: ${QP_CLIP_TTL_HOURS:-24}
      QP_FILE_TTL_HOURS: ${QP_FILE_TTL_HOURS:-72}
      QP_MAX_TEXT_KB: ${QP_MAX_TEXT_KB:-256}
      QP_SIMPLE_UPLOAD_MB: ${QP_SIMPLE_UPLOAD_MB:-20}
      QP_MAX_FILE_MB: ${QP_MAX_FILE_MB:-512}
      QP_USER_QUOTA_MB: ${QP_USER_QUOTA_MB:-2048}
      QP_SWEEP_INTERVAL_MIN: ${QP_SWEEP_INTERVAL_MIN:-15}
      QP_THUMBNAILS_ENABLED: ${QP_THUMBNAILS_ENABLED:-true}
      QP_THUMBNAIL_MAX_PX: ${QP_THUMBNAIL_MAX_PX:-320}
      QP_VAPID_PUBLIC_KEY: ${QP_VAPID_PUBLIC_KEY:-}
      QP_VAPID_PRIVATE_KEY: ${QP_VAPID_PRIVATE_KEY:-}
      QP_VAPID_SUBJECT: ${QP_VAPID_SUBJECT:-}
    volumes:
      - qp-blobs:/data/blobs

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${QP_HTTP_PORT:-8080}:80"
      - "${QP_HTTPS_PORT:-8443}:443"
    environment:
      # Consumed by the Caddyfile: the published HTTPS port (for the redirect
      # target) and the LAN HTTPS-only enforce toggle.
      QP_HTTPS_PORT: ${QP_HTTPS_PORT:-8443}
      QP_LAN_HTTPS_ONLY: ${QP_LAN_HTTPS_ONLY:-false}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - qp-caddy-data:/data
      - qp-caddy-config:/config
    depends_on:
      - server

  # Optional Cloudflare Tunnel ingress (SPEC §9.1). Start with:
  #   COMPOSE_PROFILES=tunnel docker compose up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - proxy
    profiles: ["tunnel"]

volumes:
  # qp-db (the old MariaDB volume) is intentionally not deleted; it remains on
  # the host for rollback until you `docker volume rm quick-paste_qp-db`.
  qp-pgdata:
  qp-blobs:
  qp-caddy-data:
  qp-caddy-config:
